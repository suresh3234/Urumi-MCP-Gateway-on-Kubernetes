replicaCount: 1

image:
  repository: chat-agent
  pullPolicy: IfNotPresent
  tag: "local"

service:
  type: ClusterIP
  port: 5000

config:
  gatewayUrl: "http://gateway:8080"
  memberApiKey: "placeholder-member-key"
  auth:
    existingSecret: "gateway-secret"
  openaiModel: "gpt-4o-mini"
  openaiBaseUrl: "https://api.openai.com/v1"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chat.localtest.me
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
