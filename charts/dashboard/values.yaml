replicaCount: 1

image:
  repository: dashboard
  pullPolicy: IfNotPresent
  tag: "local"

service:
  type: ClusterIP
  port: 3000

config:
  internalGatewayUrl: "http://gateway:8080"
  publicGatewayUrl: "/api/gateway"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: dashboard.localtest.me
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
