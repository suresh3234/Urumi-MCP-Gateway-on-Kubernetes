{{- if .Values.wordpress.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce.wordpress.fullname" . }}
  labels:
    {{- include "woocommerce.wordpress.labels" . | nindent 4 }}
spec:
  type: {{ .Values.wordpress.service.type }}
  ports:
    - name: http
      port: {{ .Values.wordpress.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "woocommerce.wordpress.selectorLabels" . | nindent 4 }}
{{- end }}
