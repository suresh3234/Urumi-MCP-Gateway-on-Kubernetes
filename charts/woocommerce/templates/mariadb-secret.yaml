{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "woocommerce.mariadb.secretName" . }}
  labels:
    {{- include "woocommerce.mariadb.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.mariadb.auth.rootPassword | quote }}
  mariadb-password: {{ .Values.mariadb.auth.password | quote }}
  mariadb-database: {{ .Values.mariadb.auth.database | quote }}
  mariadb-username: {{ .Values.mariadb.auth.username | quote }}
{{- end }}
