{{- if and .Values.wordpress.enabled (not .Values.wordpress.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "woocommerce.wordpress.secretName" . }}
  labels:
    {{- include "woocommerce.wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.wordpress.auth.adminUser | quote }}
  admin-password: {{ .Values.wordpress.auth.adminPassword | quote }}
  admin-email: {{ .Values.wordpress.auth.adminEmail | quote }}
{{- end }}
